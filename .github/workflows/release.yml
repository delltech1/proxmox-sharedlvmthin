name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y lvm2 multipath-tools perl shellcheck

      - name: Run qualification tests
        run: |
          python3 -m unittest discover -s tests/unit -v
          prove -Itests/unit/lib -v tests/unit/*.t
          bash -n usr/sbin/* DEBIAN/postinst DEBIAN/postrm DEBIAN/prerm
          shellcheck -x scripts/*.sh experiments/thick-generations/*.sh usr/sbin/sharedlvmthin usr/sbin/sharedlvmthin-web-configure
          python3 -m py_compile \
            usr/libexec/pve-sharedlvmthin/sharedlvmthin-web \
            usr/libexec/pve-sharedlvmthin/sharedlvmthin-health-json \
            usr/libexec/pve-sharedlvmthin/sharedlvmthin-recovery-check

      - name: Build and validate package
        run: |
          sh scripts/build.sh
          sh scripts/check-release.sh dist/*.deb

      - name: Prepare and verify GitHub-safe assets
        run: |
          for source in dist/*.deb; do
            target="$(printf '%s' "$source" | tr '~' '.')"
            if [ "$target" != "$source" ]; then
              mv "$source" "$target"
            fi
          done
          (cd dist && sha256sum ./*.deb > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_name="${GITHUB_REF_NAME##*/}"
          case "$tag_name" in
            v0.9.0-*) release_name="${tag_name#v0.9.0-}" ;;
            v*) release_name="${tag_name#v}" ;;
            *) release_name="$tag_name" ;;
          esac
          release_name="$(printf '%s' "$release_name" | tr '[:lower:]' '[:upper:]')"
          notes="docs/RELEASE-NOTES-${release_name}.md"
          test -f "$notes"
          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" dist/*.deb dist/SHA256SUMS --clobber
            gh release edit "$tag_name" \
              --prerelease \
              --title "SharedLvmThin ${release_name}" \
              --notes-file "$notes"
          else
            gh release create "$tag_name" \
              dist/*.deb dist/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "SharedLvmThin ${release_name}" \
              --notes-file "$notes"
          fi
