name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y lvm2 multipath-tools perl

      - name: Run qualification tests
        run: |
          python3 -m unittest discover -s tests/unit -v
          prove -Itests/unit/lib -v tests/unit/*.t
          bash -n usr/sbin/* DEBIAN/postinst DEBIAN/postrm DEBIAN/prerm
          python3 -m py_compile \
            usr/libexec/pve-sharedlvmthin/sharedlvmthin-web \
            usr/libexec/pve-sharedlvmthin/sharedlvmthin-health-json \
            usr/libexec/pve-sharedlvmthin/sharedlvmthin-recovery-check

      - name: Build and validate package
        run: |
          sh scripts/build.sh
          sh scripts/check-release.sh

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          suffix="${GITHUB_REF_NAME##*-}"
          release_name="$(printf '%s' "$suffix" | tr '[:lower:]' '[:upper:]')"
          notes="docs/RELEASE-NOTES-${release_name}.md"
          test -f "$notes"
          gh release create "$GITHUB_REF_NAME" \
            dist/*.deb dist/SHA256SUMS \
            --prerelease \
            --title "SharedLvmThin ${release_name}" \
            --notes-file "$notes" \
            --verify-tag
